<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SchoolTrack — Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-page">
    <!-- Left branding panel -->
    <div class="auth-left">
      <div class="auth-logo">🏫</div>
      <h1>SchoolTrack</h1>
      <p>A modern school management system for teachers, students, and administrators.</p>
    </div>

    <!-- Right login form -->
    <div class="auth-right">
      <div class="auth-card">
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to your account to continue</p>

        <!-- Role selector -->
        <div class="role-tabs">
          <div class="role-tab active" data-role="teacher" onclick="switchRole('teacher')">👩‍🏫 Teacher</div>
          <div class="role-tab" data-role="admin" onclick="switchRole('admin')">🛡️ Admin</div>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <!-- Teacher login -->
        <div id="teacherForm">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="teacherEmail" placeholder="e.g. adaobi@school.com" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="teacherPassword" placeholder="Enter your password" />
          </div>
          <button class="btn btn-primary" onclick="loginTeacher()">Sign In as Teacher</button>
        </div>

        <!-- Admin login -->
        <div id="adminForm" style="display:none">
          <div class="form-group">
            <label>Admin Username</label>
            <input type="text" id="adminUsername" placeholder="admin" />
          </div>
          <div class="form-group">
            <label>Admin Password</label>
            <input type="password" id="adminPassword" placeholder="Enter admin password" />
          </div>
          <button class="btn btn-primary" onclick="loginAdmin()">Sign In as Admin</button>
        </div>

        <p style="margin-top:20px;font-size:13px;color:var(--gray-400);text-align:center">
          Demo Teacher: <strong>adaobi@school.com</strong> / <strong>teacher123</strong><br>
          Demo Admin: <strong>admin</strong> / <strong>admin123</strong>
        </p>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    let currentRole = 'teacher';

    // Redirect if already logged in
    const session = DB.getSession();
    if (session) {
      if (session.role === 'admin') window.location.href = 'admin.html';
      else window.location.href = 'teacher.html';
    }

    function switchRole(role) {
      currentRole = role;
      document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-role="${role}"]`).classList.add('active');
      document.getElementById('teacherForm').style.display = role === 'teacher' ? 'block' : 'none';
      document.getElementById('adminForm').style.display = role === 'admin' ? 'block' : 'none';
      hideError();
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
    }
    function hideError() {
      document.getElementById('errorMsg').classList.remove('show');
    }

    function loginTeacher() {
      const email = document.getElementById('teacherEmail').value.trim();
      const password = document.getElementById('teacherPassword').value;
      if (!email || !password) return showError('Please fill in all fields.');
      const teacher = DB.loginTeacher(email, password);
      if (!teacher) return showError('Invalid email or password. Please try again.');
      DB.setSession('teacher', teacher.id);
      window.location.href = 'teacher.html';
    }

    function loginAdmin() {
      const username = document.getElementById('adminUsername').value.trim();
      const password = document.getElementById('adminPassword').value;
      if (username === 'admin' && password === 'admin123') {
        DB.setSession('admin', 'admin');
        window.location.href = 'admin.html';
      } else {
        showError('Invalid admin credentials.');
      }
    }

    // Allow Enter key
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (currentRole === 'teacher') loginTeacher();
        else loginAdmin();
      }
    });
  </script>
</body>
</html>
