<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Teachers App</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
  <!-- LOGIN FORM -->
  <div id="loginBox">
    <h2>Teacher Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button type="submit">Login</button>
    </form>
    <p id="loginMsg"></p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" style="display:none;">
    <h2>Welcome, Teacher!</h2>
    <button id="logoutBtn">Logout</button>
  </div>

  <script src="app.js"></script>
</body>
  </html>      </form>
    </div>
  </div>

  <!-- ========== DASHBOARD PAGE ========== -->
  <div id="dashboardPage" class="page hidden">

    <!-- Top navigation bar -->
    <nav class="navbar">
      <span>🎓 Teacher Portal</span>
      <div class="nav-right">
        <span id="teacherEmail" class="teacher-email"></span>
        <button id="logoutBtn" class="btn-logout">Logout</button>
      </div>
    </nav>

    <div class="dashboard-container">

      <!-- ── Add Student Section ── -->
      <div class="card section">
        <h2>➕ Add New Student</h2>
        <div class="inline-form">
          <input type="text" id="studentName" placeholder="Student full name" />
          <button id="addStudentBtn" class="btn-primary">Add Student</button>
        </div>
        <div id="studentMessage" class="message hidden"></div>
      </div>

      <!-- ── Add Score Section ── -->
      <div class="card section">
        <h2>📝 Add Score</h2>
        <div class="inline-form">
          <!-- Dropdown: populated from Firestore -->
          <select id="studentSelect">
            <option value="">-- Select a student --</option>
          </select>
          <input type="number" id="scoreInput" placeholder="Score (0–100)" min="0" max="100" />
          <input type="text"   id="subjectInput" placeholder="Subject (e.g. Math)" />
          <button id="addScoreBtn" class="btn-primary">Add Score</button>
        </div>
        <div id="scoreMessage" class="message hidden"></div>
      </div>

      <!-- ── Student List Section ── -->
      <div class="card section">
        <h2>👩‍🎓 Student List</h2>
        <div id="studentList" class="student-list">
          <p class="empty-note">No students added yet.</p>
        </div>
      </div>

    </div>
  </div>

  <!-- Firebase + App logic -->
  <script type="module" src="app.js"></script>
</body>
            </html>
