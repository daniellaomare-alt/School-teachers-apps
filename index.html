<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ========== LOGIN PAGE ========== -->
  <div id="loginPage" class="page">
    <div class="card">
      <div class="brand">
        <span class="brand-icon">🎓</span>
        <h1>Teacher Portal</h1>
        <p class="subtitle">Authorized teachers only</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@school.edu" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>

        <!-- Message area: shows success or error -->
        <div id="loginMessage" class="message hidden"></div>

        <button type="submit" id="loginBtn">
          <span id="btnText">Sign In</span>
          <span id="btnSpinner" class="spinner hidden"></span>
        </button>
      </form>
    </div>
  </div>

  <!-- ========== DASHBOARD PAGE ========== -->
  <div id="dashboardPage" class="page hidden">

    <!-- Top navigation bar -->
    <nav class="navbar">
      <span>🎓 Teacher Portal</span>
      <div class="nav-right">
        <span id="teacherEmail" class="teacher-email"></span>
        <button id="logoutBtn" class="btn-logout">Logout</button>
      </div>
    </nav>

    <div class="dashboard-container">

      <!-- ── Add Student Section ── -->
      <div class="card section">
        <h2>➕ Add New Student</h2>
        <div class="inline-form">
          <input type="text" id="studentName" placeholder="Student full name" />
          <button id="addStudentBtn" class="btn-primary">Add Student</button>
        </div>
        <div id="studentMessage" class="message hidden"></div>
      </div>

      <!-- ── Add Score Section ── -->
      <div class="card section">
        <h2>📝 Add Score</h2>
        <div class="inline-form">
          <!-- Dropdown: populated from Firestore -->
          <select id="studentSelect">
            <option value="">-- Select a student --</option>
          </select>
          <input type="number" id="scoreInput" placeholder="Score (0–100)" min="0" max="100" />
          <input type="text"   id="subjectInput" placeholder="Subject (e.g. Math)" />
          <button id="addScoreBtn" class="btn-primary">Add Score</button>
        </div>
        <div id="scoreMessage" class="message hidden"></div>
      </div>

      <!-- ── Student List Section ── -->
      <div class="card section">
        <h2>👩‍🎓 Student List</h2>
        <div id="studentList" class="student-list">
          <p class="empty-note">No students added yet.</p>
        </div>
      </div>

    </div>
  </div>

  <!-- Firebase + App logic -->
  <script type="module" src="app.js"></script>
</body>
            </html>
